  <!-- main.component.html -->
<!-- main.component.html -->
<div class="container">
    <div class="sections" #sectionContainer>
        <button (click)="scrollToPrevious()" [disabled]="currentStartIndex === 0">&lt;</button>
        <div class="section" *ngFor="let section of getVisibleSections(); let i = index" (click)="selectSection(i + currentStartIndex)">
            <h3>{{ section.title }}</h3>
        </div>
        <button (click)="scrollToNext()" [disabled]="currentStartIndex + 3 >= sections.length">&gt;</button>
    </div>
</div>

<div class="content-container" *ngIf="selectedIndex !== null">
    <div class="content">
        <h3>{{ sections[selectedIndex].title }}</h3>
        <p>{{ sections[selectedIndex].content }}</p>
    </div>
</div>
