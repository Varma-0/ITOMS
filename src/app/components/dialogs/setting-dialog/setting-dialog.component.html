   <div class="app-container">
    <div class="current-app-section">
      <div class="header">
        <h4>Current App</h4>
        <div class="d-flex aligin-items-center" style="gap:16px">
          <input type="text" placeholder="App Name / Package Name" [(ngModel)]="searchQueryCurrent" class="search-bar" />
          <button class="btn btn-primary"><i class="bx bx-search"></i></button>
        </div>
      </div>
      <div class="app-grid">
        <div *ngFor="let app of oldApps | filter: searchQueryCurrent" class="app-card" (mouseenter)="hoveredApp = app" (mouseleave)="hoveredApp = null">
          <img [src]="app.icon" alt="app icon" class="app-icon" />
          <div class="app-info">
            <h5>{{ app.name }}</h5>
            <span>{{ app.version }}</span>
          </div>
          <i *ngIf="hoveredApp === app" class="bx bx-trash" style="cursor:pointer;font-size: 20px;color:red;width:100%" (click)="moveToOptional(app)"></i>
        </div>
      </div>
    </div>

    <!-- Switch Icon -->
    <div class="switch-icon">
      <span class="material-symbols-outlined" style="color:blue">
        swap_horiz
        </span>
    </div>

    <!-- Optional App Section -->
    <div class="optional-app-section">
      <div class="header">
        <h4>Add App</h4>
        <div class="d-flex aligin-items-center" style="gap:16px">
          <input type="text" placeholder="App Name / Package Name" [(ngModel)]="searchQueryOptional" class="search-bar" />
          <button class="btn btn-primary"><i class="bx bx-search"></i></button>
        </div>
      </div>
      <div class="app-grid">
        <div *ngFor="let app of addApps | filter: searchQueryOptional" class="app-card" (mouseenter)="hoveredApp = app" (mouseleave)="hoveredApp = null">
          <img [src]="app.icon" alt="app icon" class="app-icon" />
          <div class="app-info">
            <h5>{{ app.name }}</h5>
            <!-- <p>{{ app.packageName }}</p> -->
            <span>{{ app.version }}</span>
          </div>
          <!-- Plus Icon on Hover -->
          <i *ngIf="hoveredApp === app" class="bx bx-plus plus-icon" style="background-color:rgb(168, 236, 168);color:green" (click)="moveToCurrent(app)"></i>
        </div>
      </div>
    </div>
  </div>
  <mat-dialog-actions align="end" class="d-flex justify-content-evenly">
    <button class="btn btn-secondary" mat-dialog-close>Cancel</button>
    <button class="btn btn-primary" [mat-dialog-close]="true" (click)="confirm()">Confirm</button>
  </mat-dialog-actions>
